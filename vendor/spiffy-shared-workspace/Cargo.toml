[workspace]
members = ["crates/spiffy-shared"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["Spiffy Scenes contributors"]

[workspace.dependencies]
base64 = "0.22.1"
blake3 = { version = "1.8.2", features = ["pure"] }
chrono = { version = "0.4.45", features = ["serde"] }
file-id = "0.2.3"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
subtle = "2.6.1"
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }
